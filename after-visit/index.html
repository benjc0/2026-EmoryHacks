<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F4F0E2" />
  <title>Your care at home | Mend</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="dashboard.css" />
  <script type="module" src="dashboard.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to your plan</a>

  <!-- Lucide-style icons, inline so there is no icon font to load -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="m21 3-7 7"/><path d="m3 21 7-7"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></symbol>
    <symbol id="i-pill" viewBox="0 0 24 24"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/><path d="M9 10h.01"/><path d="M12 10h.01"/><path d="M15 10h.01"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></symbol>
    <symbol id="i-arm" viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="2"/><path d="M12 7v7"/><path d="M12 9.5 18 6"/><path d="M12 9.5 8 12"/><path d="m12 14-3 7"/><path d="m12 14 3 7"/></symbol>
    <symbol id="i-squat" viewBox="0 0 24 24"><circle cx="12" cy="4" r="2"/><path d="M12 6v5l-4 3v6"/><path d="m12 11 4 3v6"/><path d="M8 8.5h8"/></symbol>
    <symbol id="i-leg" viewBox="0 0 24 24"><circle cx="5" cy="8" r="2"/><path d="M5 10v4h14"/><path d="M3 18h18"/></symbol>
  </svg>

  <main id="main" class="page page--wide dash">
    <!-- Greeting (the soft shapes behind it are decorative) -->
    <header class="greet-row">
      <div class="greet">
        <svg class="blobs" viewBox="0 0 200 140" aria-hidden="true"><path d="M140 10c30 4 56 30 50 62s-38 58-72 54-56-30-50-60 42-60 72-56z" fill="var(--accent-soft)"/><circle cx="58" cy="44" r="30" fill="var(--blue-soft)"/></svg>
        <p class="brand">Mend</p>
        <h1 id="hello">Good morning, Min-jun</h1>
        <p id="date" class="greet__date"></p>
      </div>
      <div class="greet-actions">
        <!-- Visit navigation stays visible while the dashboard connects. -->
        <a class="btn btn--secondary visit-btn" id="visit-copilot-link" href="/" aria-label="Start a doctor's visit: live interpreter, notes and question reminders during your appointment"><svg class="icon" aria-hidden="true"><use href="#i-chat"/></svg><span class="visit-btn__label">Start a doctor's visit</span></a>
        <button class="btn btn--icon" id="theme" type="button" aria-pressed="false" aria-label="Dark mode"><svg class="icon" aria-hidden="true"><use href="#i-moon"/></svg></button>
      </div>
    </header>

    <!-- 1. This week -->
    <section class="tile cal-card" aria-labelledby="week-title">
      <h2 id="week-title" class="visually-hidden">This week</h2>
      <div class="week-head">
        <span class="streak-pill"><svg class="icon" aria-hidden="true"><use href="#i-flame"/></svg><span id="streak"></span></span>
        <span class="week-cheer" id="cheer"></span>
      </div>
      <div class="week-track">
        <span class="week-fill" id="week-fill" aria-hidden="true"></span>
        <ol class="week" id="week" aria-label="This week. Choose a day to see its plan."></ol>
      </div>
    </section>

    <!-- 2. Today's exercises (the one pale-blue field) -->
    <section class="hero-tile ex-hero" aria-labelledby="ex-title">
      <div class="section-head ex-head">
        <div>
          <h2 id="ex-title" class="hero-h"></h2>
          <p class="hero-sub" id="ex-sub"></p>
        </div>
        <button id="expand" class="btn btn--icon btn--icon-surface" type="button" aria-label="Open today's exercises full screen"><svg class="icon" aria-hidden="true"><use href="#i-expand"/></svg></button>
      </div>
      <svg class="stones" id="stones" viewBox="0 0 320 84" aria-hidden="true"></svg>
      <ul class="ex-list" id="exercises"></ul>
      <div class="hero-foot">
        <p class="note" id="pt-note"></p>
        <button id="start" class="btn btn--accent btn--lg" type="button">Start session</button>
      </div>
    </section>

    <!-- 3 + 4. Next visit and medicine, then 5. questions -->
    <div class="side">
      <div class="pair">
        <section class="tile mini" aria-labelledby="visit-k">
          <div class="tile-head">
            <span class="badge-icon badge-icon--blue"><svg class="icon" aria-hidden="true"><use href="#i-calendar"/></svg></span>
            <div><h2 class="mini__k" id="visit-k">Next visit</h2><p class="mini__v" id="visit"></p></div>
          </div>
        </section>
        <section class="tile mini" aria-labelledby="med-k">
          <div class="tile-head">
            <span class="badge-icon badge-icon--peach"><svg class="icon" aria-hidden="true"><use href="#i-pill"/></svg></span>
            <div><h2 class="mini__k" id="med-k">Medicine</h2><p class="mini__v" id="medicine"></p></div>
          </div>
        </section>
      </div>

      <section class="tile questions" aria-labelledby="q-title">
        <div class="tile-head q-head">
          <span class="badge-icon badge-icon--peach"><svg class="icon" aria-hidden="true"><use href="#i-chat"/></svg></span>
          <h2 id="q-title" class="q-title">For your next visit</h2>
        </div>
        <ul class="qlist" id="questions"></ul>
        <a class="visit-q-link" id="visit-copilot-questions" href="#" hidden>At your appointment? Open Visit Copilot. These questions will be ready.</a>
        <form id="question-form" class="addq" novalidate>
          <label for="question" class="visually-hidden">Add a question for your next visit</label>
          <input class="input" id="question" maxlength="500" placeholder="Add a question" autocomplete="off" aria-describedby="question-hint" />
          <button type="button" id="mic" class="btn btn--icon" aria-label="Say your question"><svg class="icon" aria-hidden="true"><use href="#i-mic"/></svg></button>
        </form>
        <p class="fine q-hint" id="question-hint">Press Enter to save. Saved on this device only.</p>
      </section>
    </div>
  </main>

  <!-- Help: a round button, bottom-right on every screen size -->
  <button class="fab" type="button" data-help aria-label="Help"><svg class="icon" aria-hidden="true"><use href="#i-help"/></svg></button>

  <!-- Day detail, exercise plan, help -->
  <dialog id="detail" aria-labelledby="detail-title">
    <div class="modal-head">
      <div><h2 id="detail-title"></h2><p class="modal-sub" id="detail-sub"></p></div>
      <button id="close" class="btn btn--icon" type="button" aria-label="Close"><svg class="icon" aria-hidden="true"><use href="#i-x"/></svg></button>
    </div>
    <div id="detail-body"></div>
  </dialog>
  <div id="notice" class="toast" role="status" hidden></div>
</body>
</html>
